agent:
  templates:
    system_template: |-
      You are a root cause analysis assistant that identifies the exact code locations that need to be modified to fix reported issues.
      Your task is to perform deep code analysis to find the actual source of problems, not just the symptoms.
      You must look beyond the files mentioned in the issue description and investigate the entire codebase to understand the true root cause. Focus on finding the EXACT code that needs to be modified.
      When you have completed your root cause analysis, use the 'analysis_complete' command to generate and save your structured JSON results. This will automatically end the session.

    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a python code repository in the directory {{working_dir}}. 
      
      <pr_description>
      {{problem_statement}}
      </pr_description>

      **CRITICAL**: Your goal is to find the ROOT CAUSE of this issue and identify the EXACT code that needs to be modified. 
      Do NOT limit your investigation to files mentioned in the issue description. Explore the ENTIRE codebase to understand where the problem truly originates.

      **Root Cause Analysis Process:**

      1. **Deep Repository Exploration**
         - Examine the complete codebase structure, not just obvious files
         - Understand the full architecture and data flow
         - Map out all relevant subsystems and their interactions

      2. **Trace the Problem to Its Source**
         - Start from the symptoms described in the issue
         - Follow the code execution path backwards
         - Identify where the incorrect behavior actually originates
         - Don't stop at the first file that shows symptoms - keep digging

      3. **Differentiate Symptoms from Causes**
         - Files mentioned in the issue may only show SYMPTOMS
         - The ROOT CAUSE is often in:
           * Lower-level utility modules
           * Base classes or abstract implementations
           * Configuration or setup code
           * Data validation or transformation layers
           * Core logic that gets called from multiple places
         - Ask yourself: "If I only fix the file mentioned in the issue, will the underlying problem persist?"

      4. **Identify EXACT Code to Modify**
         - Pinpoint the specific lines of code that cause the issue
         - Extract the current problematic code content
         - Ensure the modification addresses the root cause, not symptoms

      **Final Step**: Create a JSON file with your analysis, then use 'analysis_complete'.

      **REQUIRED JSON Structure** - Create `/root/analysis.json` with EXACTLY this format:

      {
        "files_to_modify": [
          {
            "file_path": "relative/path/to/file.py",
            "modifications": [
              {
                "location": {
                  "start_line": 45,
                  "end_line": 50
                },
                "current_code": "def problematic_function():\n    # current implementation\n    return wrong_value"
              }
            ]
          }
        ]
      }

      **Important Notes**:
      - `file_path`: Relative path from repository root
      - `location`: Exact line numbers where code needs to be modified
      - `current_code`: The EXACT current code content that has the problem (copy it precisely from the file)
      - Include ONLY the files that need modification (do not include files that don't need changes), each modification should contain only the problematic code that needs to be changed
      - No need to include test files that require modification

      **Remember**: 
      - The issue description may only mention symptom files, you must find the root cause
      - Explore files NOT mentioned in the issue if they could be the true source
      - Extract EXACT code content from the actual files, Be precise about line numbers
      - Focus on ROOT CAUSE modifications, not surface-level patches
      - Only include the code that actually needs to be modified
      - No need to include test files that require modification

      **Process**: 
      1. Thoroughly investigate the ENTIRE relevant codebase
      2. Trace the problem to its fundamental origin
      3. Identify the EXACT code that needs to be fixed
      4. Create `/root/analysis.json` with your findings
      5. Run: `analysis_complete`

    next_step_template: |-
      OBSERVATION:
      {{observation}}
      
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.

  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic  
      - path: tools/analysis_complete
    registry_variables:
      USE_FILEMAP: 'true'
      ANALYSIS_COMPLETE_MESSAGES:
        - |
          Thank you for your root cause analysis work. You have investigated the codebase to identify 
          the exact code locations that need to be modified.
          
          Please finalize your analysis by using the 'analysis_complete' command to save your findings.
          
          Your JSON file must include:
          - files_to_modify: Array of files with exact locations and current code that needs changing
            * file_path: relative path to the file
            * modifications: array of specific code locations
              - location: exact start and end line numbers
              - current_code: the actual problematic code (exact copy from file)
          
          Ensure you've identified the ROOT CAUSE locations with EXACT code content and line numbers.
          
          Use 'analysis_complete' to save your structured analysis and end the session.
          
          Problem statement reference:
          {{problem_statement}}
    enable_bash_tool: true
    parse_function:
      type: function_calling
      
  history_processors:
    - type: cache_control
      last_n_messages: 2
      
  model:
    temperature: 1
    completion_kwargs:
      reasoning_effort: 'high'